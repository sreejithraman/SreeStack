name: showroom tests

on:
  pull_request:
    paths:
      - ".github/workflows/showroom-tests.yml"
      - "skills/showroom/**"
      - "tests/showroom/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/showroom-tests.yml"
      - "skills/showroom/**"
      - "tests/showroom/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests/showroom -v
      - run: python -m json.tool skills/showroom/references/registry.schema.json >/dev/null
      - run: python -m json.tool skills/showroom/references/delivery-description.schema.json >/dev/null
      - run: python -m json.tool skills/showroom/references/delivery-result.schema.json >/dev/null
