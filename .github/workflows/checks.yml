name: Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  checks:
    name: Skills and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Python version
        id: pyver
        shell: bash
        run: echo "version=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"
      - name: Cache check environment and gitleaks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .git/sreestack-check-env
            ~/.cache/sreestack-tools
          key: ${{ runner.os }}-check-tools-v1-py${{ steps.pyver.outputs.version }}-${{ hashFiles('scripts/requirements-*.txt') }}-gitleaks-8.30.1
      - name: Run repository checks and secret scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_RUN_BUDGET_SECONDS: "55"
        shell: bash
        run: |
          set -uo pipefail
          start_ts=$SECONDS
          gitleaks_dir="$HOME/.cache/sreestack-tools"
          gitleaks_bin="$gitleaks_dir/gitleaks-8.30.1"
          mkdir -p "$gitleaks_dir"
          if [[ ! -x "$gitleaks_bin" ]]; then
            (
              set -euo pipefail
              curl --fail --silent --show-error --location \
                https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
                --output "$RUNNER_TEMP/gitleaks.tar.gz"
              echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
              tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
              mv "$RUNNER_TEMP/gitleaks" "$gitleaks_bin"
              chmod +x "$gitleaks_bin"
            ) || exit 1
          fi

          gitleaks_log="$RUNNER_TEMP/gitleaks.log"
          "$gitleaks_bin" git --redact --log-opts=HEAD . >"$gitleaks_log" 2>&1 &
          gitleaks_pid=$!

          python3 scripts/check.py
          checks_rc=$?

          wait "$gitleaks_pid"
          gitleaks_rc=$?
          echo "::group::Secret scan (gitleaks)"
          cat "$gitleaks_log"
          echo "::endgroup::"

          elapsed=$((SECONDS - start_ts))
          echo "Checks and secret scan finished in ${elapsed}s (budget: ${CI_RUN_BUDGET_SECONDS}s)"

          status=0
          if [[ "$checks_rc" -ne 0 ]]; then
            echo "::error::Repository checks failed (exit ${checks_rc})"
            status=1
          fi
          if [[ "$gitleaks_rc" -ne 0 ]]; then
            echo "::error::Secret scan failed (exit ${gitleaks_rc})"
            status=1
          fi
          if [[ "$elapsed" -gt "$CI_RUN_BUDGET_SECONDS" ]]; then
            echo "::error::Checks exceeded ${CI_RUN_BUDGET_SECONDS}s runtime budget (took ${elapsed}s)"
            status=1
          fi
          exit "$status"
